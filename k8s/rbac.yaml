---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opendesk-predictive-agent
  namespace: opendesk-predictive-agent
  labels:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opendesk-predictive-agent
  labels:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
rules:
  # Core resources — read-only with remediation write permissions
  # pods: 'delete' for pod restart action (stuck/unhealthy pod remediation)
  # events: 'create' for recording remediation events and audit trail
  # nodes: 'patch' for cordon action (isolating problematic nodes)
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces", "nodes", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch", "delete", "create", "patch"]
  # Workloads
  # deployments: 'patch', 'update' for rollout restart, scale, and resource tuning actions
  # deployments/scale: 'patch' for HPA-style scaling remediation
  # daemonsets, statefulsets, replicasets: read-only for monitoring only
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Batch
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Metrics (metrics.k8s.io — for kubectl top)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  # Storage (read-only)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # Networking (read-only)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opendesk-predictive-agent
  labels:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
subjects:
  - kind: ServiceAccount
    name: opendesk-predictive-agent
    namespace: opendesk-predictive-agent
roleRef:
  kind: ClusterRole
  name: opendesk-predictive-agent
  apiGroup: rbac.authorization.k8s.io
