---
apiVersion: v1
kind: Service
metadata:
  name: opendesk-predictive-agent-metrics
  namespace: opendesk-predictive-agent
  labels:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  selector:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: opendesk-predictive-agent-health
  namespace: opendesk-predictive-agent
  labels:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: opendesk-predictive-agent-health
  namespace: opendesk-predictive-agent
  labels:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
  ports:
    - name: health
      port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP
