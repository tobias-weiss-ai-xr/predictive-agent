---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opendesk-predictive-agent-config
  namespace: opendesk-predictive-agent
  labels:
    app.kubernetes.io/name: opendesk-predictive-agent
    app.kubernetes.io/component: operator
data:
  # LLM backend configuration
  LLM_BACKEND: "ollama"
  OLLAMA_URL: "http://ollama.llm.svc.cluster.local:11434"
  OLLAMA_MODEL: "qwen3-30b-a3b:latest"
  OLLAMA_TIMEOUT: "180"

  # Reconcile configuration
  RECONCILE_INTERVAL: "60"
  ANALYSIS_TTL: "300"
  ANALYSIS_TTL_MAX: "1200"
  MAX_PODS_PER_CYCLE: "3"
  LOG_VERBOSITY: "info"

  # Prediction configuration
  PREDICTION_ENABLED: "true"
  PREDICTION_RISK_THRESHOLD: "0.5"

  # Kalman filter tuning
  KALMAN_PROCESS_NOISE: "1.0"
  KALMAN_MEASUREMENT_NOISE: "100.0"

  # Watch namespaces (comma-separated)
  OPERATOR_WATCH_NAMESPACES: "opendesk,opendesk-edu,default,llm,monitoring,backup,kube-system"

  # Remediation configuration
  REMEDIATION_ENABLED: "true"
  REMEDIATION_DRY_RUN: "true"
  REMEDIATION_MAX_PER_MIN: "5"
  REMEDIATION_MAX_PER_HOUR: "50"
  REMEDIATION_COOLDOWN_S: "300"
  REMEDIATION_RISK_THRESHOLD: "70.0"
  REMEDIATION_PROTECTED_NS: "kube-system,opendesk-predictive-agent"

  # Alert configuration
  ALERT_EMAIL_TO: "tobias.weiss@uni-marburg.de"

  # SMTP configuration
  SMTP_HOST: "smtp.uni-marburg.de"
  SMTP_PORT: "587"

  # Webhook configuration
  WEBHOOK_URL: ""
